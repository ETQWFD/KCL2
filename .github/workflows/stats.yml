name: Refresh Stats And Deploy

# 用仓库自带 GITHUB_TOKEN（已鉴权，不受匿名 60 次/小时限流）定时汇总三仓真实下载量，
# 生成 website/_data/stats.json 并提交；GITHUB_TOKEN 的提交不会触发 push 型工作流，
# 因此提交后显式触发 pages.yml 部署（不在此工作流里重复上传 Pages 产物）。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather real release stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p website/_data
          python3 .github/scripts/gen_stats.py
      - name: Commit stats if changed
        id: commit
        run: |
          git config user.name "ETC Team"
          git config user.email "2416444244@qq.com"
          git add website/_data/stats.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "stats unchanged"
          else
            git commit -m "stats: refresh real release download counts"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main --repo "${GITHUB_REPOSITORY}"
