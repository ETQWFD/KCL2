name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 直接发布到 gh-pages 分支，Pages 从分支构建。
      # 不走 upload-pages-artifact / deploy-pages，避免 GitHub 偶发的 artifact 元数据抓取失败。
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
          enable_jekyll: false
          cname: etc.os.kg
          commit_message: 'deploy: site update'
