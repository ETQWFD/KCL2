name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p _site
          cp website/index.html website/manual.html website/dan.html website/download.html website/announce.json website/announce-ce.json website/announcement-mobile.json website/favicon.ico _site/
          cp website/CNAME _site/CNAME
          cp website/.nojekyll _site/.nojekyll
          if [ -d website/assets ]; then cp -r website/assets _site/; fi
          if [ -d website/_data ]; then cp -r website/_data _site/; fi
      # 重跑时上一次的 github-pages 产物还挂在同一次运行上，会与本次重名冲突，先清掉
      - name: Purge stale pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
            -q '.artifacts[] | select(.name=="github-pages") | .id' | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
            done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v5
